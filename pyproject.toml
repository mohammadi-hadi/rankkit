[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rankkit"
version = "0.1.0"
description = "Ranking evaluation with error bars: NDCG, MRR and MAP with confidence intervals, plus position-bias correction for click logs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hadi Mohammadi" }]
keywords = [
    "ranking",
    "search",
    "recommender-systems",
    "ndcg",
    "evaluation",
    "learning-to-rank",
    "position-bias",
    "information-retrieval",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "build"]

[project.urls]
Homepage = "https://github.com/mohammadi-hadi/rankkit"
Explorer = "https://mohammadi.cv/rankkit/"
DOI = "https://doi.org/10.5281/zenodo.21811914"

[project.scripts]
rankkit = "rankkit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["rankkit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Malformed input data raises ValueError on purpose: the CLI catches it and
# turns it into a friendly `error:` message with exit code 2.
ignore = ["TRY004"]
